# `tinacms build` bundles the /admin app and needs more than the ~2 GB default
# heap that Node picks on 8 GB build machines such as Cloudflare Workers Builds.
nodeOptions: --max-old-space-size=4096
onlyBuiltDependencies:   # pnpm 10
  - better-sqlite3
  - core-js
  - esbuild
  - protobufjs
  - unrs-resolver
ignoredBuiltDependencies:
  - workerd
allowBuilds:             # pnpm 11
  better-sqlite3: true
  core-js: true
  esbuild: true
  protobufjs: true
  unrs-resolver: true
  workerd: false
